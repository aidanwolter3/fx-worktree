[package]
name = "fx-worktree"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
tempfile = "3.10"




